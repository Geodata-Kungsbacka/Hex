name: Hex regressionstester
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manuell körning är vägen för agenter som saknar en egen PostgreSQL: de
  # pushar sin branch och startar arbetsflödet på den (se "Testa via CI" i
  # CLAUDE.md). Push och PR körs bara mot main.
  workflow_dispatch:
    inputs:
      bas_ref:
        description: 'Version att uppgradera från i jobbet uppgradering (branch, tagg eller SHA)'
        required: false
        default: 'main'
permissions:
  contents: read
# En ny körning på samma ref avbryter den gamla. Händelsetypen ingår i nyckeln
# så att en push och en PR på samma commit inte avbryter varandra.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '16'
            image: postgis/postgis:16-3.5
          - postgres: '17'
            image: postgis/postgis:17-3.5
    # --log-driver none: annars skriver GitHub ut hela serverloggen när
    # containern stoppas, sist i jobbloggen. Den som läser loggen bakifrån
    # (logg-API:et, agenternas get_job_logs) ser då bara checkpoints i stället
    # för sammanfattningen från test_run_all.py. Serverns meddelanden till
    # sviterna syns ändå i sviternas egen utdata.
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hex_ci_ephemeral
          POSTGRES_DB: hex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --log-driver none
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: hex_ci_ephemeral
      PGDATABASE: hex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera testberoenden
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install psycopg2-binary requests
      - name: Installera Hex i engångsdatabasen
        run: |
          python - <<'PY'
          import os
          import install_hex
          cfg = dict(host=os.environ['PGHOST'], port=os.environ['PGPORT'],
                     dbname=os.environ['PGDATABASE'], user=os.environ['PGUSER'],
                     password=os.environ['PGPASSWORD'], owner_role='gis_admin')
          install_hex.install(cfg)
          PY
      - name: Kör samtliga sviter och underkänn överhoppade tester
        shell: bash
        run: |
          set -o pipefail
          python tests/test_run_all.py --strikt -v 2>&1 | tee hex-tests.log
      - name: Spara testloggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-tests-pg${{ matrix.postgres }}
          path: hex-tests.log

  # Uppgradering från en tidigare version: basversionen installeras, får
  # användardata och uppgraderas med den här versionens install_hex.upgrade().
  # Resultatet jämförs objekt för objekt med en ny installation (se
  # .github/scripts/kontrollera_uppgradering.py), och sedan körs samtliga
  # sviter mot den uppgraderade databasen. Fångar ändringar som saknar
  # HEX-MIGRERING – sådant som test-jobbet ovan aldrig ser, eftersom det alltid
  # börjar från en tom databas.
  uppgradering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '16'
            image: postgis/postgis:16-3.5
          - postgres: '17'
            image: postgis/postgis:17-3.5
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hex_ci_ephemeral
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --log-driver none
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: hex_ci_ephemeral
      PGDATABASE: hex_uppgraderad
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera testberoenden
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install psycopg2-binary requests
      # PR: basbranchens commit. Push till main: commiten före pushen.
      # Manuell körning: inmatningen bas_ref. Saknas en tidigare commit (ny
      # branch, första pushen) används origin/main.
      - name: Checka ut basversionen
        env:
          PR_BAS: ${{ github.event.pull_request.base.sha }}
          FORE_PUSH: ${{ github.event.before }}
          VALD_BAS: ${{ inputs.bas_ref }}
        run: |
          bas="${PR_BAS:-}"
          if [ -z "$bas" ] && [ -n "${VALD_BAS:-}" ]; then
            bas="$VALD_BAS"
            git rev-parse --verify -q "origin/$bas^{commit}" >/dev/null && bas="origin/$bas"
          fi
          if [ -z "$bas" ] && [ -n "${FORE_PUSH:-}" ] && [ "$FORE_PUSH" != "0000000000000000000000000000000000000000" ]; then
            bas="$FORE_PUSH"
          fi
          bas="${bas:-origin/main}"
          echo "Basversion: $bas ($(git rev-parse --short "$bas^{commit}"))"
          git worktree add --detach "$RUNNER_TEMP/bas" "$bas"
      - name: Uppgradera och jämför med ny installation
        run: python .github/scripts/kontrollera_uppgradering.py --bas "$RUNNER_TEMP/bas" --db hex_uppgraderad
      - name: Kör samtliga sviter mot den uppgraderade databasen
        shell: bash
        run: |
          set -o pipefail
          python tests/test_run_all.py --strikt -v 2>&1 | tee hex-tests-uppgradering.log
      - name: Spara testloggen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hex-tests-uppgradering-pg${{ matrix.postgres }}
          path: hex-tests-uppgradering.log
          if-no-files-found: ignore
